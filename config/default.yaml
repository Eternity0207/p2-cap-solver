# Cap-Solver default configuration
# Override via CAPSOLVER_* environment variables or config/local.yaml

server:
  host: "0.0.0.0"
  port: 8080
  api_key: ""
  cors_origins: ["*"]

browser:
  headless: false
  max_concurrent: 1
  job_timeout_seconds: 300
  navigation_timeout_ms: 60000
  action_timeout_ms: 30000
  viewport_width: 1280
  viewport_height: 720
  args: []
  extensions:
    nopecha_path: "extensions/nopecha"
    discord_token_path: "extensions/discord-token-login"
    load_nopecha: true
  user_data_base: "data/browser_profiles"
  executable_path: ""
  shared_profile: true
  shared_profile_id: "default"
  load_extensions_at_startup: true

jobs:
  max_retries: 3
  retry_delay_seconds: 5
  cleanup_after_hours: 24
  store_path: "data/jobs.db"
  artifacts_dir: "data/artifacts"

automation:
  poketwo:
    verify_url_pattern: "verify.poketwo.net/captcha/"
    captcha:
      mode: "auto"
      nopecha_api_key: ""
      solved_selector: 'input[name="cf-turnstile-response"]'
      solved_attribute: "value"
      max_wait_seconds: 120
      poll_interval_seconds: 2
    cloudflare:
      max_wait_seconds: 240
      cf_clearance_required: true
    verify_button:
      text: "Verify"
      selectors:
        - 'button:has-text("Verify")'
        - 'input[type="submit"][value*="Verify"]'
        - 'a:has-text("Verify")'
    discord:
      oauth_url_pattern: "discord.com/oauth2"
      authorize_button:
        text: "Authorize"
        selectors:
          - 'button:has-text("Authorize")'
          - 'span:has-text("Authorize")'
      token_login:
        wait_after_login_seconds: 5
    success:
      text_patterns:
        - "thanks for verifying"
        - "you can now close this page"
        - "success!"
      max_wait_seconds: 90

logging:
  level: "INFO"
  format: "json"
  file: "data/logs/cap-solver.log"

platform:
  display: ":99"
