services:
  cap-solver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cap-solver
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - CAPSOLVER_API_KEY=${CAPSOLVER_API_KEY:-}
      - CAPSOLVER_BASE_DIR=/app
      - DISPLAY=:99
    volumes:
      - ./data:/app/data
      - ./config/local.yaml:/app/config/local.yaml:ro
      - ./extensions/nopecha:/app/extensions/nopecha:ro
      - ./extensions/discord-token-login:/app/extensions/discord-token-login:ro
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
